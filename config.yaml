# ANNOTATION STRATEGIES: call with --anns strategy
# ANNOTATION STRATEGIES — ROIHU DEPLOYMENT
#
# This file is the deployment config for Roihu / the LazypipeDB dataset project.
# It lists ONLY strategies whose databases are installed here.  The published
# benchmarks are reproduced by LazypipeX/config.yaml, which keeps the nt.*-based
# strategy set; the two files diverge BY DESIGN.
#
# Naming:
#   <source>.<taxon>   two rounds — Minimap2 vs the vi subset to find candidates,
#                      then BLASTN vs abv to re-annotate them
#   .env               round 2 (or a chain's mapping step) runs against the
#                      COMPLETE database instead of the abv subset — for
#                      environmental/faecal samples and to catch retroviruses
#   .fast              round 1 only
#   vi.chainN          one round, chained annotators; contigs left unannotated
#                      by one step pass to the next
#
# NOTE: vi.chain1-4 keep their published names but resolve to core_nt here,
# whereas the published config resolves them to nt.  Results are therefore NOT
# comparable across the two configs by strategy name alone — the versioned
# `name:` field of each database (e.g. core_nt.abv.2026_07_18) is what records
# which data a run actually used.
ann.strategies:
    # --- core_nt: the NT replacement; all six databases installed ----------
    corent.vi:         "--ann1 minimap.core_nt.vi  --ann2 vi:blastn.core_nt.abv"
    corent.vi.env:     "--ann1 minimap.core_nt.vi  --ann2 vi:blastn.core_nt"
    corent.vi.fast:    "--ann1 minimap.core_nt.vi"
    corent.abv:        "--ann1 minimap.core_nt.abv --ann2 vi:blastn.core_nt.abv,ab:blastn.core_nt.abv"
    corent.abv.env:    "--ann1 minimap.core_nt.abv --ann2 vi:blastn.core_nt,ab:blastn.core_nt"
    corent.abv.fast:   "--ann1 minimap.core_nt.abv"

    # --- RefSeq (release 236) ---------------------------------------------
    refseq.vi:         "--ann1 minimap.refseq.vi  --ann2 vi:blastn.refseq.abv"
    refseq.vi.fast:    "--ann1 minimap.refseq.vi"
    refseq.abv:        "--ann1 minimap.refseq.abv --ann2 vi:blastn.refseq.abv,ab:blastn.refseq.abv"

    # --- nt: only minimap.nt.vi is installed on Roihu ----------------------
    nt.vi.fast:        "--ann1 minimap.nt.vi"

    # --- chained: published names, core_nt databases -----------------------
    vi.chain1:         "--ann1 minimap.core_nt.abv,blastn.core_nt.abv,blastp.uniref100.abv"
    vi.chain2:         "--ann1 minimap.core_nt.abv,blastp.uniref100.abv"
    vi.chain3:         "--ann1 minimap.core_nt.abv,diamondp.uniref100.abv"
    vi.chain1.env:     "--ann1 minimap.core_nt,blastn.core_nt.abv,blastp.uniref100.abv"
    vi.chain2.env:     "--ann1 minimap.core_nt,blastp.uniref100.abv"
    vi.chain3.env:     "--ann1 minimap.core_nt,diamondp.uniref100.abv"


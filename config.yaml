   db:            "$taxonomy_ncbi"
   name:          "NCBI taxonomy"
   update:        0 # 1 => update, 0 => don't update
   update_time:   5 # in days
   url:           "ftp://ftp.ncbi.nlm.nih.gov/pub/taxonomy/taxdump.tar.gz"


ICTV.VMR:
   # Tab-separated export of the ICTV Virus Metadata Resource spreadsheet.
   # lazypipe.pl cuts these columns by name: 'Isolate ID', Species, Genus,
   # Family, Order, Genome, 'Host source', and derives Isolate.NID from
   # 'Isolate ID' with ^VMR([0-9]+) — so the header row and the VMR<digits>
   # identifier format are both required.
   db:            "$databases/taxonomy/ICTV/VMR_MSL40.v2.20260223.tsv"
   name:          "ICTV VMR MSL40.v2"
   url:           "https://ictv.global/sites/default/files/VMR/VMR_MSL40.v2.20260223.xlsx"
